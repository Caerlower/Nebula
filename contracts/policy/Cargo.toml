[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
# Protocol 27 (soroban-sdk major tracks protocol).
soroban-sdk = "27.0.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
